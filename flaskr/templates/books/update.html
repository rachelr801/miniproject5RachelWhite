{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit "{{ book['title'] }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post" class="col-md-8">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input name="title" id="title" class="form-control"
        value="{{ request.form['title'] or book['title'] }}" required>
    </div>

    <div class="mb-3">
      <label for="book_author" class="form-label">Book Author</label>
      <input name="book_author" id="book_author" class="form-control" value="{{ request.form['book_author'] or book['book_author'] }}" required>
    </div>

    <div class="row">
      <div class="col-sm-6 mb-3">
        <label for="status" class="form-label">Status</label>
        <select name="status" id="status" class="form-select">
          {% for s in ['Want to read', 'Reading', 'Finished'] %}
            <option {% if (request.form['status'] or book['status']) == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-sm-6 mb-3">
        <label for="rating" class="form-label">Rating (1-5)</label>
        <input type="number" name="rating" id="rating" class="form-control" min="1" max="5" value="{{ request.form['rating'] or book['rating'] or '' }}">
      </div>
    </div>

    <div class="mb-3">
      <label for="notes" class="form-label">Notes</label>
      <textarea name="notes" id="notes" class="form-control" rows="6">{{ request.form['notes'] or book['notes'] or '' }}</textarea>
    </div>

    <input type="submit" value="Save" class="btn btn-primary">
    <a href="{{ url_for('books.index') }}" class="btn btn-outline-secondary">Cancel</a>
  </form>
  <hr>
  <button type=""button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#deleteModal">
    Delete
  </button>

  <div class=""modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel">Delete book?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete "{{ book['title'] }}"? This can't be undone.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <form action="{{ url_for('books.delete', id=book['id']) }}" method="post">
            <input type="submit" class="btn btn-danger" value="Delete">
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
