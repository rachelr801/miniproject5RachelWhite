{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Edit "{{ book['title'] }}"{% endblock %}</h1>
{% endblock %}

{% block content %}
  <form method="post">
    <label for="title">Title</label>
    <input name="title" id="title"
      value="{{ request.form['title'] or book['title'] }}" required>
    
    <label for="book_author">Book Author</label>
    <input name="book_author" id="book_author" value="{{ request.form['book_author'] or book['book_author'] }}" required>

    <label for="status">Status</label>
    <select name="status" id="status">
      {% for s in ['Want to read', 'Reading', 'Finished'] %}
        <option {% if (request.form['status'] or book['status']) == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}  
    </select>

    <label for="rating">Rating (1-5)</label>
    <input type="number" name="rating" id="rating" min="1" max="5" value="{{request.form['rating'] or book['rating'] or '' }}">

    <label for="notes">Notes</label>
    <textarea name="notes" id="notes">{{request.form['notes'] or book['notes'] or '' }}</textarea>

    <input type="submit" value="Save">
  </form>
  <hr>
  <form action="{{ url_for('books.delete', id=book['id']) }}" method="post">
    <input class="danger" type="submit" value="Delete" onclick="return confirm('Are you sure?');">
  </form>
{% endblock %}
